name: CD - Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:

      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            echo "Starting deployment..."

            sudo docker pull docker.io/yogitadeshmukh/devops-github-actions-project:latest

            sudo docker stop devops-flask-app || true

            sudo docker rm devops-flask-app || true

            sudo docker run -d \
              --name devops-flask-app \
              --restart unless-stopped \
              -p 5000:5000 \
              docker.io/yogitadeshmukh/devops-github-actions-project:latest

            sleep 5

            sudo docker ps

            curl --fail http://localhost:5000/health

            echo "Deployment successful!"
